<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 My Game Arcade</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }
  h1 {
    font-size: 2.5rem;
    margin-bottom: 10px;
    background: linear-gradient(135deg, #7f5af0, #2cb67d);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle { color: #94a1b2; margin-bottom: 40px; font-size: 1.1rem; }
  .games {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 24px; max-width: 900px; width: 100%;
  }
  .game-card {
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 32px 28px;
    text-decoration: none;
    color: #fff;
    transition: transform 0.2s, box-shadow 0.2s;
    display: flex; flex-direction: column; gap: 12px;
  }
  .game-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 40px rgba(127,90,240,0.3);
  }
  .game-card .emoji { font-size: 3rem; }
  .game-card h2 { font-size: 1.3rem; font-weight: 800; }
  .game-card p { font-size: 0.9rem; color: #94a1b2; line-height: 1.5; }
  .badge {
    display: inline-block; padding: 4px 12px; border-radius: 20px;
    font-size: 0.7rem; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.1em; width: fit-content;
  }
  .badge.multiplayer { background: rgba(127,90,240,0.2); color: #7f5af0; }
  .badge.solo { background: rgba(44,182,125,0.2); color: #2cb67d; }
  .socials {
    margin-top: 50px;
    text-align: center;
  }
  .socials p {
    color: #94a1b2;
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-bottom: 16px;
  }
  .social-links {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .social-btn {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    text-decoration: none;
    color: #fff;
  }
  .social-btn svg {
    width: 22px;
    height: 22px;
  }
  .social-btn:hover {
    transform: translateY(-4px) scale(1.1);
  }
  
  /* Platform Colors */
  .social-btn.instagram {
    background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
    box-shadow: 0 4px 15px rgba(225, 48, 108, 0.3);
  }
  .social-btn.instagram:hover {
    box-shadow: 0 8px 25px rgba(225, 48, 108, 0.5);
  }
  
  .social-btn.tiktok {
    background: linear-gradient(135deg, #010101, #25f4ee);
    box-shadow: 0 4px 15px rgba(37, 244, 238, 0.3);
  }
  .social-btn.tiktok:hover {
    box-shadow: 0 8px 25px rgba(37, 244, 238, 0.5);
  }
  
  .social-btn.youtube {
    background: linear-gradient(135deg, #ff0000, #cc0000);
    box-shadow: 0 4px 15px rgba(255, 0, 0, 0.3);
  }
  .social-btn.youtube:hover {
    box-shadow: 0 8px 25px rgba(255, 0, 0, 0.5);
  }
  footer { margin-top: 60px; color: #94a1b2; font-size: 0.8rem; }
</style>
</head>
<body>
  <h1>🎮 My Game Arcade</h1>
  <p class="subtitle">Pick a game and play!</p>
  <div class="games">
    <a href="./think-alike/" class="game-card">
      <div class="emoji">🧠</div>
      <span class="badge multiplayer">2 Players</span>
      <h2>Do We Think Alike?</h2>
      <p>See a word, type what comes to mind. Do you and your friend think the same?</p>
    </a>
  </div>
